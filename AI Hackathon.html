<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/templatemo-medic-care.css">

  <style>
    .hero {
      height: 100vh;
    }

    .carousel-item img {
      height: 100vh;
      object-fit: cover;
    }

    .form-box {
      position: absolute;
      top: 50%;
      left: 70%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.85);
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      z-index: 10;
    }
  </style>
</head>



<body>

 <!-- Tracking Modal -->
<div class="modal fade" id="trackingModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

 <div class="modal-header bg-primary text-white">
  <h5 class="modal-title">🚑 Ambulance Tracking</h5>
  <button type="button"
        class="btn-close btn-close-white"
        data-bs-dismiss="modal">
</button>

</div>




      <div class="modal-body text-center">
        <p class="fw-bold mb-3">Tracking patient location...</p>

        <iframe 
          width="100%" 
          height="400" 
          style="border:0"
          src="https://www.google.com/maps?q=24.7136,46.6753&output=embed">
        </iframe>

      </div>

    </div>
  </div>
</div>


<header class="bg-light fixed-top shadow-lg py-3">
  <div class="container text-center">
    <h3 class="text-primary">Smart Emergency</h3>
      <h1 class="mt-auto mb-2">
                                    Better
                                    <div class="animated-info">
                                        <span class="animated-item">health</span>
                                        <span class="animated-item">days</span>
                                        <span class="animated-item">lives</span>
                                    </div>
                                </h1>
  </div>
</header>


<section class="hero position-relative">

  <div id="myCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">

    <div class="carousel-inner">

      <div class="carousel-item active">
        <img src="images/slider/doctor-s-hand-holding-stethoscope-closeup.jpg" class="d-block w-100">
      </div>

      <div class="carousel-item">
        <img src="images/slider/portrait-successful-mid-adult-doctor-with-crossed-arms.jpg" class="d-block w-100">
      </div>

    </div>

  </div>


  <!-- Form -->
  <div class="form-box">
    <form id="healthForm">
      <input type="number" name="heart" class="form-control mb-2" placeholder="Heartbeats" required>
      <input type="number" name="pressure" class="form-control mb-2" placeholder="Pressure" required>
      <input type="number" name="oxygen" class="form-control mb-2" placeholder="Oxygen" required>
      <input type="number" name="temperature" class="form-control mb-2" placeholder="Temperature" required>
    </form>
  </div>

</section>


<!-- Modal -->
<div class="modal fade" id="resultModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Health Status</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">

        <div id="modalResult" class="fw-bold fs-5 mb-3"></div>

        <div id="countdownBox" class="d-none">
          <p>Calling ambulance in <span id="countdown">15</span> seconds...</p>
          <button class="btn btn-warning" id="cancelBtn">
            Cancel Call
          </button>
        </div>

      </div>

    </div>
  </div>
</div>




<script src="js/custom.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>



<script>
let trackingModalInstance = null;

document.addEventListener("DOMContentLoaded", function(){

const form = document.getElementById("healthForm");
const inputs = form.querySelectorAll("input");

let timer = null;
let seconds = 15;

function resetCountdownUI() {
    document.getElementById("countdownBox").classList.add("d-none");
    document.getElementById("cancelBtn").disabled = false;
    document.getElementById("countdown").innerText = 15;
}

const trackingModalEl = document.getElementById("trackingModal");

trackingModalEl.addEventListener("hidden.bs.modal", function () {

    const iframe = this.querySelector("iframe");
    iframe.src = iframe.src; 

});


function startCountdown() {

    const countdownElement = document.getElementById("countdown");
    const countdownBox = document.getElementById("countdownBox");

    countdownBox.classList.remove("d-none");
    seconds = 15;
    countdownElement.innerText = seconds;

    timer = setInterval(() => {
        seconds--;
        countdownElement.innerText = seconds;

        if (seconds <= 0) {
            clearInterval(timer);
            timer = null;

            document.getElementById("cancelBtn").disabled = true;
            countdownElement.innerText = "Ambulance dispatched 🚑";

           setTimeout(() => {

    
    const resultModalEl = document.getElementById("resultModal");
    const resultModal = bootstrap.Modal.getInstance(resultModalEl);
    if (resultModal) {
        resultModal.hide();
    }

   
    trackingModalInstance = new bootstrap.Modal(
    document.getElementById("trackingModal")
);
trackingModalInstance.show();


}, 1500);

        }

    }, 1000);
}

document.getElementById("cancelBtn").addEventListener("click", function(){

    if (timer) {
        clearInterval(timer);
        timer = null;
    }

    
    const modalResult = document.getElementById("modalResult");
    modalResult.innerHTML = "Call cancelled ✅";
    modalResult.className = "text-success fw-bold";

    
    document.getElementById("countdownBox").classList.add("d-none");

});


function checkAndAnalyze() {

    let allFilled = true;

    inputs.forEach(input => {
        if (input.value === "") {
            allFilled = false;
        }
    });

    if (allFilled) {

        const formData = new FormData(form);

        fetch("/analyze", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(data => {

            const modalResult = document.getElementById("modalResult");
            const modal = new bootstrap.Modal(document.getElementById("resultModal"));

            modalResult.innerText = data.result;

            resetCountdownUI();

            if (data.result.includes("Emergency")) {
                modalResult.className = "text-danger fw-bold";
                startCountdown();
            } 
            else if (data.result.includes("follow-up")) {
                modalResult.className = "text-warning fw-bold";
            } 
            else {
                modalResult.className = "text-success fw-bold";
            }

            modal.show();
        });
    }
}

inputs.forEach(input => {
    input.addEventListener("blur", checkAndAnalyze);
});

const resultModalEl = document.getElementById("resultModal");
resultModalEl.addEventListener("hidden.bs.modal", function () {
    document.getElementById("healthForm").reset();
});

const trackingModalElReset = document.getElementById("trackingModal");
trackingModalElReset.addEventListener("hidden.bs.modal", function () {
    document.getElementById("healthForm").reset();
});

});




</script>



</body>
</html>
